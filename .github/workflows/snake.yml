name: snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%238FBEDC&color_dots=%230B1622,%231B3448,%232E5A7A,%235F93B8,%23BFDCEF
            dist/snake-light.svg?palette=github-light&color_snake=%233E729B&color_dots=%23EAF1F7,%23C6DCEB,%238FB6D1,%235C8CB0,%232E5A7A

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
