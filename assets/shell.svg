<svg xmlns="http://www.w3.org/2000/svg" width="294" height="120" viewBox="0 0 294 120" role="img" aria-label="shell">
  <style>
    svg { --ink:#10202D; --frost:#3E729B; --muted:#6D8CA3; --chip:#FFFFFF; --chipline:#CCDFEC; }
    @media (prefers-color-scheme: dark) { svg { --ink:#EAF3FA; --frost:#8FBEDC; --muted:#5B7E99; --chip:#122436; --chipline:#2A4864; } }
  </style>

  <rect x="1" y="1" width="292" height="118" rx="8"
        fill="var(--chip)" stroke="var(--chipline)"/>
  <rect x="1" y="27" width="292" height="1" fill="var(--chipline)"/>
  <g stroke="var(--frost)" stroke-width="1" fill="none" opacity="0.75"><path d="M17,10.0 L20.0,13 L17,16.0 L14.0,13 Z"/><path d="M32,10.0 L35.0,13 L32,16.0 L29.0,13 Z"/><path d="M47,10.0 L50.0,13 L47,16.0 L44.0,13 Z"/></g>

  <g font-family="'SF Mono', 'DejaVu Sans Mono', 'Roboto Mono', Consolas, monospace" font-size="11">
    <text x="17" y="49" fill="var(--frost)">$</text>
    <text x="31" y="49" fill="var(--ink)">pytest -q --alluredir=allure</text>
    <text x="17" y="71" fill="var(--muted)">........................  42 passed</text>
    <text x="17" y="93" fill="var(--frost)">$</text>
    <rect x="32" y="83" width="7" height="12" fill="var(--frost)">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
